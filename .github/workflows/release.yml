name: Publish to PyPI
on:
  release:
    types: [published]
jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
